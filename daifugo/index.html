<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>合言葉大富豪</title>
<style>
:root{--ink:#f6f2e6;--muted:#cfe0d2;--accent:#f5c542;--red:#d23b3b;--wood1:#8a4b1d;--wood2:#5a2e0e;--feltA:#4fae2c;--feltB:#1f6b1a;--feltC:#0f4610;--line:rgba(255,255,255,.18)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 50% 55%,var(--feltA) 0%,var(--feltB) 55%,var(--feltC) 100%);background-attachment:fixed;transition:filter .6s}
body.revmode{--feltA:#b03a6a;--feltB:#6a1a40;--feltC:#2e0a1c;--accent:#ffd36e}
#app{max-width:560px;margin:0 auto;min-height:100%}
.page{padding:14px 12px 28px}
h1{font-size:22px;margin:6px 0 2px;letter-spacing:.05em;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.panel{background:rgba(0,0,0,.25);border:2px solid rgba(245,197,66,.35);border-radius:14px;padding:14px;margin-bottom:12px;backdrop-filter:blur(2px)}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
input{width:100%;font-size:17px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);outline:none}
input:focus{border-color:var(--accent)}
button{font:inherit;font-size:15px;font-weight:700;border:0;border-radius:12px;padding:11px 14px;cursor:pointer;color:#3a2600;background:linear-gradient(#ffe08a,#f5b52e);box-shadow:0 3px 0 #a86f0c,0 4px 8px rgba(0,0,0,.3);transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #a86f0c}
button.ghost{background:rgba(0,0,0,.25);color:var(--ink);border:1px solid var(--line);box-shadow:none}
button.small{font-size:12px;padding:6px 9px;border-radius:9px}
button.round{width:42px;height:42px;padding:0;border-radius:50%;font-size:18px;background:radial-gradient(circle at 35% 30%,#ffd76a,#e08a12);border:2px solid #7a3e08}
button:disabled{opacity:.4;cursor:default;transform:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow button{flex:1}
.err{color:#ffc4c4;font-size:13px;min-height:18px;margin-top:6px}
.note{color:var(--muted);font-size:12px;line-height:1.6}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.pl{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:13px}
.pl.me{border-color:var(--accent)}
.pl .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .meta{color:var(--muted);font-size:11px;margin-top:3px}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:99px;background:rgba(255,255,255,.18);margin-left:4px;vertical-align:middle;font-weight:700}
.badge.gold{background:var(--accent);color:#3a2600}
.badge.bad{background:#7a2b2b}
.code{font-size:20px;font-weight:800;letter-spacing:.08em;color:var(--accent);word-break:break-all}
.rank li{margin:8px 0;font-size:16px}
.hint{font-size:12px;color:#fff;text-align:center;min-height:16px;text-shadow:0 1px 2px #000}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rule{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:rgba(0,0,0,.3);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-size:13px;padding:8px 10px}
.rule small{font-weight:400;color:var(--muted);font-size:10px;margin-top:2px;line-height:1.3}
.rule.on{background:rgba(245,197,66,.22);border-color:var(--accent)}
.rule.on b::before{content:"✓ ";color:var(--accent)}
.rule:disabled{opacity:1}
.seg{display:flex;gap:4px;margin-top:6px}
.seg button{flex:1;font-size:13px;padding:7px}
.seg button:not(.on){background:rgba(0,0,0,.3);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#000d;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw}
.toast.on{opacity:1}

/* ===== 卓 ===== */
.table{position:relative;height:100vh;height:100dvh;overflow:hidden;max-width:560px;margin:0 auto}
.table::before{content:"";position:absolute;inset:6px;border:3px solid rgba(245,197,66,.35);border-radius:18px;pointer-events:none;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.tbar{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:8px;align-items:flex-start;z-index:5}
.ticker{flex:1;background:rgba(0,0,0,.4);border:2px solid #c99a2e;border-radius:12px;padding:6px 10px;font-size:12px;line-height:1.5;min-height:44px;overflow:hidden}
.ticker div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker div:last-child{font-size:14px;font-weight:700}
.ticker .rd{color:var(--accent);font-size:10px;font-weight:700}
.seat{position:absolute;transform:translate(-50%,0);width:86px;display:flex;flex-direction:column;align-items:center;z-index:2}
.plate{max-width:96px;min-width:70px;padding:3px 8px;border-radius:7px;text-align:center;font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(#a85d24,var(--wood2));border:2px solid #3b1c06;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 4px rgba(0,0,0,.4);position:relative;z-index:3}
.avawrap{position:relative;width:62px;height:62px;margin-top:-2px}
.ava{position:relative;z-index:2;width:62px;height:62px;border-radius:6px;border:3px solid #6b3612;outline:2px solid #e9c27a;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.4)}
.fan{position:absolute;left:50%;bottom:4px;width:0;height:0;z-index:1}
.bk{position:absolute;left:-12px;bottom:0;width:24px;height:34px;border-radius:3px;border:1.5px solid #fff;background:repeating-linear-gradient(45deg,#2b55b8 0 3px,#4a78d8 3px 6px);transform-origin:50% 140%;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.sstat{margin-top:4px;font-size:11px;font-weight:800;padding:1px 8px;border-radius:99px;background:rgba(0,0,0,.5);white-space:nowrap}
.sstat.pass{background:#555}.sstat.win{background:var(--accent);color:#3a2600}.sstat.lose{background:#7a2b2b}
.seat.turn .plate{background:linear-gradient(#ffe08a,#f5b52e);color:#3a2600;border-color:#a86f0c;animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 14px 4px rgba(255,214,90,.8)}}
.seat.out{opacity:.55;filter:grayscale(.6)}
.title{position:absolute;top:-8px;right:-14px;z-index:4;font-size:9px;font-weight:800;padding:1px 5px;border-radius:6px;background:#222;border:1px solid #e9c27a}
.title.gold{background:var(--accent);color:#3a2600}
.field{position:absolute;left:8%;right:8%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:1}
.fieldcards{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;--cw:54px}
.fieldby{font-size:12px;color:#fff;text-shadow:0 1px 2px #000}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tag{border-radius:6px;padding:2px 8px;font-weight:800;font-size:12px;background:#fff;color:var(--red)}
.tag.eb{color:#2b4fa3}.tag.lock{color:#1c7a4a}
.mebar{position:absolute;left:10px;right:10px;display:flex;align-items:flex-end;gap:8px;z-index:4}
.meinfo{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.meinfo .plate{min-width:0}
.mebtns{flex:1;display:flex;flex-direction:column;align-items:stretch;gap:5px}
.mebtns .bb{display:flex;gap:8px}
.mebtns button{flex:1;padding:10px}
.mebtns button.passbtn{background:linear-gradient(#e6e6e6,#a9a9a9);box-shadow:0 3px 0 #666;color:#222}
.hand{position:absolute;left:0;right:0;bottom:0;z-index:3}
.hand.myturn::after{content:"";position:absolute;left:10%;right:10%;bottom:-30px;height:60px;border-radius:50%;background:radial-gradient(rgba(255,214,90,.55),transparent 70%);animation:pulse 1.4s ease-in-out infinite;pointer-events:none}
@keyframes pulse{50%{opacity:.35}}
.hand .card{position:absolute;left:0;top:0;transition:transform .16s ease;cursor:pointer;transform-origin:50% 100%}

/* ===== カード ===== */
.card{--cw:56px;width:var(--cw);height:calc(var(--cw)*1.42);font-size:calc(var(--cw)*.3);border-radius:calc(var(--cw)*.1);background:linear-gradient(160deg,#fff,#f1eee4);color:#151515;position:relative;box-shadow:0 2px 5px rgba(0,0,0,.45);border:1px solid #bbb;user-select:none;-webkit-user-select:none;font-family:Georgia,"Times New Roman",serif}
.card.red{color:var(--red)}
.card .ix{position:absolute;left:.18em;top:.12em;display:flex;flex-direction:column;align-items:center;line-height:.95}
.card .ix b{font-size:1.25em;font-weight:900;letter-spacing:-.04em}
.card .ix i{font-style:normal;font-size:1.05em}
.card .ix2{left:auto;top:auto;right:.18em;bottom:.12em;transform:rotate(180deg)}
.card .pip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.1em;padding-top:.3em}
.card .pip.face{font-size:1.9em;font-weight:900}
.card .pip.face span{font-size:.55em;margin-left:.05em}
.card.joker{background:linear-gradient(160deg,#fff,#f3e3ff);color:#7b2fb3}
.card.joker .pip{flex-direction:column;font-size:1.7em;padding:0}
.card.joker .pip small{font-size:.32em;font-weight:900;letter-spacing:.1em;font-family:-apple-system,sans-serif}
.card.sel{box-shadow:0 0 0 3px var(--accent),0 6px 14px rgba(0,0,0,.5)}
.card.dim{filter:brightness(.72) saturate(.7)}
.card.drop{animation:drop .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drop{from{transform:translateY(80px) scale(.6) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
.hand .card.deal{animation:deal .4s ease-out both}
@keyframes deal{from{opacity:0;margin-top:-260px}to{opacity:1;margin-top:0}}

/* ===== メニュー ===== */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .inner{width:100%;max-width:560px;max-height:85vh;overflow:auto;background:linear-gradient(#1f5d1a,#0f3a0d);border-top:3px solid #c99a2e;border-radius:18px 18px 0 0;padding:16px 14px 24px}

/* ===== 演出 ===== */
#fx{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
#app.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,3px) rotate(-1deg)}40%{transform:translate(7px,-3px) rotate(1deg)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}
.banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:46px;font-weight:900;white-space:nowrap;letter-spacing:.06em;color:#fff;-webkit-text-stroke:2px rgba(0,0,0,.55);text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px currentColor;animation:ban 1.4s cubic-bezier(.2,1.3,.4,1) both}
.banner.small{font-size:28px}
.banner.rev{color:#ff5c8a}.banner.eight{color:#7fd6ff}.banner.eb{color:#9fb6ff}.banner.lock{color:#7ff0b0}
.banner.finish{color:#ffd54a}.banner.foul{color:#ff7b7b}.banner.miyako{color:#d48bff}.banner.skip{color:#ffb36b}.banner.round{color:#fff}
@keyframes ban{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}40%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-60%) scale(1.05);opacity:0}}
.slash{position:absolute;left:-10%;top:50%;width:120%;height:6px;background:linear-gradient(90deg,transparent,#fff,#7fd6ff,transparent);transform:rotate(-14deg) scaleX(0);transform-origin:left;animation:slash .45s ease-out forwards;box-shadow:0 0 18px #7fd6ff}
@keyframes slash{60%{transform:rotate(-14deg) scaleX(1);opacity:1}100%{transform:rotate(-14deg) scaleX(1);opacity:0}}
.conf{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall var(--d) linear forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r))}}
.flash{position:absolute;inset:0;background:#fff;animation:flash .45s ease-out forwards}
@keyframes flash{from{opacity:.55}to{opacity:0}}

/* ===== 追加: チャット・準備・ボンバー ===== */
.chat{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;display:flex;align-items:flex-end;justify-content:center}
.chat[hidden]{display:none}
.chat .inner{width:100%;max-width:560px;max-height:70vh;display:flex;flex-direction:column;gap:8px;background:linear-gradient(#1f5d1a,#0f3a0d);border-top:3px solid #c99a2e;border-radius:18px 18px 0 0;padding:14px 12px calc(14px + env(safe-area-inset-bottom))}
.msgs{flex:1;overflow:auto;min-height:120px;display:flex;flex-direction:column;gap:6px}
.msg{align-self:flex-start;max-width:85%;background:rgba(255,255,255,.12);border-radius:12px 12px 12px 3px;padding:6px 10px;font-size:14px}
.msg b{display:block;font-size:10px;color:var(--accent)}
.msg.mine{align-self:flex-end;background:rgba(245,197,66,.25);border-radius:12px 12px 3px 12px}
.stamps{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}
.stamps button{flex:none}
#chatBtn{position:relative}
.dot{position:absolute;top:-4px;right:-4px;background:#e23;color:#fff;font-size:10px;border-radius:99px;padding:1px 5px;font-weight:800;line-height:1.4}
.bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6px;background:#fff;color:#222;font-size:12px;font-weight:700;padding:5px 9px;border-radius:12px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis;z-index:9;box-shadow:0 3px 8px rgba(0,0,0,.4);animation:bub 4.5s ease forwards;pointer-events:none}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff}
@keyframes bub{0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.8)}6%{opacity:1;transform:translateX(-50%) scale(1)}85%{opacity:1}100%{opacity:0}}
.pl{position:relative}
.pl.ready{border-color:#6fd36f}
.pl .ok{color:#8ff08f;font-weight:700}
.mebar .bubble{left:60px}
.chatprev{cursor:pointer}
.seat.sm{transform:translate(-50%,0) scale(.78);transform-origin:50% 0}
.seat.xs{transform:translate(-50%,0) scale(.68);transform-origin:50% 0}
.seat.talk{z-index:8}
.sstat.think{background:#d26a1c}
.bombpick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.bombpick button{padding:6px 0;font-size:14px;background:#fff;color:#222;box-shadow:0 2px 0 #888;border-radius:8px;font-family:Georgia,serif;font-weight:900}
.bombpick button.on{background:#ff6a3d;color:#fff;box-shadow:0 2px 0 #9a2a10}

/* ===== 演出v3 ===== */
html,body,button,.card,.seat{touch-action:manipulation}
.table,.hand{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#app.shake2{animation:shake2 .6s}
@keyframes shake2{0%,100%{transform:none}10%{transform:translate(-14px,6px) rotate(-2deg)}25%{transform:translate(12px,-8px) rotate(2deg)}40%{transform:translate(-10px,4px)}55%{transform:translate(8px,-4px) rotate(1deg)}75%{transform:translate(-4px,2px)}}
.spark{position:fixed;border-radius:50%;pointer-events:none;z-index:16}
.ring{position:fixed;border:4px solid #fff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:16}
.fxghost{position:fixed;display:flex;gap:4px;transform:translate(-50%,-50%);pointer-events:none;z-index:14}
.fxghost .card{--cw:54px}
.boom{position:fixed;font-size:60px;pointer-events:none;z-index:17}
.flyback{position:fixed;width:26px;height:36px;border-radius:4px;border:2px solid #fff;background:repeating-linear-gradient(45deg,#2b55b8 0 3px,#4a78d8 3px 6px);pointer-events:none;z-index:16;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.floattxt{position:fixed;font-size:18px;font-weight:900;color:#fff;-webkit-text-stroke:1px rgba(0,0,0,.6);text-shadow:0 2px 4px rgba(0,0,0,.5);white-space:nowrap;pointer-events:none;z-index:16}
.floattxt.pass{color:#ddd;font-size:16px}
.floattxt.win{color:#ffd54a;font-size:22px}
.banner.myturn{color:#ffe36a;font-size:40px}
.table.myturn::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;border-radius:18px;box-shadow:inset 0 0 0 4px rgba(255,214,90,.9),inset 0 0 60px rgba(255,214,90,.45);animation:edge 1.3s ease-in-out infinite}
@keyframes edge{50%{box-shadow:inset 0 0 0 4px rgba(255,214,90,.5),inset 0 0 25px rgba(255,214,90,.2)}}
.ribbon{position:absolute;left:50%;transform:translateX(-50%);z-index:5;background:linear-gradient(90deg,#ff9a1f,#ffd54a,#ff9a1f);color:#3a2000;font-weight:900;font-size:13px;padding:3px 16px;border-radius:99px;box-shadow:0 2px 10px rgba(255,180,40,.7);animation:rib 1s ease-in-out infinite;pointer-events:none;white-space:nowrap}
@keyframes rib{50%{transform:translateX(-50%) scale(1.08)}}
.table.myturn #play:not(:disabled){animation:btnp 1s ease-in-out infinite}
@keyframes btnp{50%{box-shadow:0 3px 0 #a86f0c,0 0 18px 4px rgba(255,214,90,.8)}}

/* ===== アイコン画像 ===== */
.ava.img{background-size:cover;background-position:center;background-color:#333}
.miniava{display:inline-block;vertical-align:middle;margin-right:5px;flex:none}
.miniava .ava{width:100%;height:100%;border-width:2px;outline-width:1px;font-size:60%;border-radius:6px}
.rank li{display:flex;align-items:center;gap:4px}
.avpick{flex:none;width:52px;height:52px;padding:0;border-radius:12px;font-size:24px;background:rgba(0,0,0,.35);border:2px dashed rgba(255,255,255,.4);box-shadow:none;overflow:hidden}
.avpick span{display:block;width:100%;height:100%;background-size:cover;background-position:center}
.pl .nm{display:flex;align-items:center}

.netbar{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:40;background:#c2410c;color:#fff;font-size:13px;font-weight:800;padding:6px 14px;border-radius:99px;box-shadow:0 3px 10px rgba(0,0,0,.4);animation:rib 1s ease-in-out infinite}
.netbar[hidden]{display:none}

/* ===== 全画面演出 v4 ===== */
body.ebmode{--feltA:#5566ff;--feltB:#1d2672;--feltC:#0a0d30;--accent:#bcd0ff}
body.revmode.ebmode{--feltA:#8a55c8;--feltB:#3a1d6a;--feltC:#160a2e}
body.lockmode .table::before{border:7px dashed #cfd6dc;box-shadow:inset 0 0 0 3px #6f7880,inset 0 0 70px rgba(0,0,0,.55)}
.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;line-height:.9;font-size:120px;font-weight:900;color:rgba(255,255,255,.07);transform:rotate(-14deg);pointer-events:none;z-index:0;white-space:nowrap;animation:wmPulse 2.4s ease-in-out infinite}
.wm.rev{transform:rotate(180deg) rotate(-14deg)}
.wm.eb{font-size:100px;color:rgba(190,205,255,.09)}
.wm.lock{font-size:90px;top:auto;bottom:22%;height:auto;color:rgba(255,255,255,.08)}
.wm.lock.red{color:rgba(255,110,110,.12)}
@keyframes wmPulse{50%{opacity:.55}}
.cutin{position:fixed;inset:0;pointer-events:none;z-index:18;overflow:hidden;--b1:#fff;--b2:#888;--lc:rgba(255,255,255,.35);animation:ciBg var(--d,1.3s) ease forwards}
@keyframes ciBg{0%{background:rgba(0,0,0,0)}12%,80%{background:rgba(0,0,0,.5)}100%{background:rgba(0,0,0,0)}}
.cutin .lines{position:absolute;left:50%;top:50%;width:250vmax;height:250vmax;margin:-125vmax 0 0 -125vmax;background:repeating-conic-gradient(from 0deg,transparent 0deg 3.2deg,var(--lc) 3.2deg 4deg);-webkit-mask:radial-gradient(circle,transparent 14%,#000 32%);mask:radial-gradient(circle,transparent 14%,#000 32%);animation:ciLines var(--d,1.3s) linear forwards}
@keyframes ciLines{0%{opacity:0;transform:scale(1.5) rotate(0)}14%,80%{opacity:1}100%{opacity:0;transform:scale(1) rotate(10deg)}}
.cutin .band{position:absolute;left:-15%;right:-15%;top:50%;height:150px;margin-top:-75px;background:linear-gradient(90deg,var(--b2),var(--b1) 30%,var(--b1) 70%,var(--b2));box-shadow:0 0 50px var(--b1),0 0 0 4px rgba(255,255,255,.7) inset;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:skewY(-9deg) translateX(-110%);animation:ciBand var(--d,1.3s) cubic-bezier(.2,.9,.2,1) forwards}
@keyframes ciBand{0%{transform:skewY(-9deg) translateX(-110%)}16%{transform:skewY(-9deg) translateX(0)}80%{transform:skewY(-9deg) translateX(3%)}100%{transform:skewY(-9deg) translateX(120%)}}
.cutin .ttl{font-size:min(66px,15vw);font-weight:900;color:#fff;-webkit-text-stroke:3px rgba(0,0,0,.55);text-shadow:5px 5px 0 rgba(0,0,0,.35);letter-spacing:.04em;white-space:nowrap;transform:skewY(9deg);animation:ciTxt var(--d,1.3s) ease forwards}
.cutin .ttl.long{font-size:min(54px,12vw)}
@keyframes ciTxt{0%,12%{transform:skewY(9deg) scale(2.4);opacity:0}24%{transform:skewY(9deg) scale(.94);opacity:1}31%{transform:skewY(9deg) scale(1.06)}38%,100%{transform:skewY(9deg) scale(1)}}
.cutin .sub{font-size:15px;font-weight:800;color:#fff;transform:skewY(9deg);margin-top:4px;text-shadow:0 2px 3px rgba(0,0,0,.5);white-space:nowrap}
.k-rev{--b1:#ff2a6a;--b2:#5a0030;--lc:rgba(255,90,150,.45)}
.k-eight{--b1:#1fb6ff;--b2:#062a6a;--lc:rgba(120,210,255,.45)}
.k-eb{--b1:#6a7bff;--b2:#15155a;--lc:rgba(160,175,255,.45)}
.k-lock{--b1:#3fcf7f;--b2:#08401f;--lc:rgba(160,255,200,.4)}
.k-lockr{--b1:#ff4a4a;--b2:#4a0808;--lc:rgba(255,150,150,.4)}
.k-skip{--b1:#ff9a1f;--b2:#5a2400;--lc:rgba(255,200,120,.45)}
.k-seven{--b1:#ffcc33;--b2:#b4366a;--lc:rgba(255,230,140,.45)}
.k-bomb{--b1:#ff5a1f;--b2:#2a0600;--lc:rgba(255,150,60,.55)}
.k-win{--b1:#ffd23a;--b2:#8a5a00;--lc:rgba(255,225,120,.6)}
.k-win .ttl{color:#fff6c2;text-shadow:0 0 18px #fff3a0,5px 5px 0 rgba(120,70,0,.5)}
.k-silver{--b1:#d8dee6;--b2:#555e68;--lc:rgba(230,235,245,.45)}
.k-bronze{--b1:#d9894a;--b2:#5a2c0a;--lc:rgba(240,180,130,.4)}
.k-dark{--b1:#4a4a4a;--b2:#0a0a0a;--lc:rgba(160,160,160,.3)}
.k-round{--b1:#2d8a3a;--b2:#0a2a10;--lc:rgba(255,255,255,.22)}
.bigslash{position:fixed;left:-20%;top:50%;width:140%;height:10px;background:linear-gradient(90deg,transparent,#fff 20%,#9be7ff 50%,#fff 80%,transparent);box-shadow:0 0 30px #7fd6ff,0 0 60px #7fd6ff;transform-origin:left center;transform:rotate(-28deg) scaleX(0);z-index:19;pointer-events:none;animation:bslash .5s ease-out forwards}
.bigslash.b{transform:rotate(22deg) scaleX(0);animation-name:bslash2;top:46%}
@keyframes bslash{50%{transform:rotate(-28deg) scaleX(1);opacity:1}100%{transform:rotate(-28deg) scaleX(1);opacity:0;height:2px}}
@keyframes bslash2{50%{transform:rotate(22deg) scaleX(1);opacity:1}100%{transform:rotate(22deg) scaleX(1);opacity:0;height:2px}}
.rays{position:fixed;left:50%;top:45%;width:220vmax;height:220vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(var(--rc) 0deg 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 5%,transparent 45%);mask:radial-gradient(circle,#000 5%,transparent 45%);z-index:13;pointer-events:none;mix-blend-mode:screen}
.rainitem{position:fixed;top:0;z-index:17;pointer-events:none}
.crown{position:fixed;font-size:46px;z-index:19;pointer-events:none;filter:drop-shadow(0 0 10px #ffd54a)}
.swipe{position:fixed;inset:0;z-index:16;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 40px,rgba(255,180,80,.35) 40px 46px,transparent 46px 90px),linear-gradient(90deg,transparent,rgba(255,160,40,.35),transparent)}
.chainbar{position:fixed;left:-10%;right:-10%;top:40%;font-size:34px;letter-spacing:-6px;text-align:center;white-space:nowrap;z-index:17;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.chainbar.r{top:55%}
.lightning{position:fixed;inset:0;z-index:17;pointer-events:none;background:linear-gradient(115deg,transparent 46%,#fff 47%,#ffd0e0 48%,transparent 49%),linear-gradient(70deg,transparent 60%,#fff 61%,transparent 62%);animation:ltn .8s steps(2) forwards}
@keyframes ltn{0%,40%{opacity:1}20%,60%{opacity:0}100%{opacity:0}}
.smoke{position:fixed;inset:0;z-index:15;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(60,40,30,.75),rgba(30,20,10,.35) 40%,transparent 70%);animation:smoke 1.5s ease-out forwards}
@keyframes smoke{0%{opacity:0;transform:scale(.5)}20%{opacity:1}100%{opacity:0;transform:scale(1.6)}}

/* ===== ドパガキ ===== */
.onoma{position:fixed;z-index:19;pointer-events:none;font-weight:900;white-space:nowrap;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-style:italic;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:4px 4px 0 rgba(0,0,0,.5)}
.strobe{position:fixed;inset:0;z-index:12;pointer-events:none;mix-blend-mode:overlay;background:linear-gradient(135deg,#ff004c,#ffb700,#44ff00,#00e5ff,#7a00ff,#ff00c8)}
.stamp{position:fixed;left:50%;top:50%;z-index:21;pointer-events:none;font-size:min(92px,22vw);font-weight:900;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;padding:6px 26px;border:10px double;border-radius:20px;background:rgba(255,255,255,.88);white-space:nowrap;box-shadow:0 0 0 6px rgba(255,255,255,.6),0 10px 30px rgba(0,0,0,.5)}
.praise{position:fixed;z-index:19;pointer-events:none;font-size:40px;font-weight:900;font-style:italic;white-space:nowrap;background:linear-gradient(90deg,#ff004c,#ffb700,#44ff00,#00e5ff,#a64dff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #fff;filter:drop-shadow(0 3px 0 #000) drop-shadow(0 0 12px rgba(255,255,255,.7))}
.praise.big{font-size:54px}
.combo{position:fixed;z-index:19;pointer-events:none;color:#fff;font-weight:900;font-style:italic;font-size:18px;-webkit-text-stroke:1px #000;text-shadow:0 0 10px #ff9a1f}
.combo b{font-size:38px;color:#ffd54a}
.alarm{position:fixed;inset:0;z-index:16;pointer-events:none;box-shadow:inset 0 0 0 10px #ff1a3a,inset 0 0 90px rgba(255,0,40,.65);animation:alarm .3s steps(2) infinite}
@keyframes alarm{50%{opacity:.15}}
.k-joker{--b1:#a64dff;--b2:#ff00c8;--lc:rgba(255,160,255,.55)}
.k-joker .band{animation-name:ciBand,hueSpin;animation-duration:var(--d,1.3s),1s;animation-iteration-count:1,infinite}
@keyframes hueSpin{to{filter:hue-rotate(360deg)}}
.k-reach{--b1:#ff1a3a;--b2:#3a0008;--lc:rgba(255,80,100,.55)}
.k-win .band{animation-name:ciBand,hueSpin;animation-duration:var(--d,1.3s),2.5s;animation-iteration-count:1,infinite}

/* ===== パチンコ風漢字 ===== */
.kanji{position:fixed;z-index:20;pointer-events:none;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:900;line-height:1;white-space:nowrap;letter-spacing:-.02em}
.kanji span{position:relative;display:block;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 3px #fff) drop-shadow(0 0 1px #000) drop-shadow(4px 6px 0 rgba(0,0,0,.65)) drop-shadow(0 0 18px var(--glow))}
.kanji .kback{position:absolute;left:50%;top:50%;width:260%;height:260%;transform:translate(-50%,-50%);background:radial-gradient(circle,var(--glow) 0%,transparent 60%);opacity:.55;z-index:-1}
.kanji.k-red{--glow:#ff1a1a}.kanji.k-red span{background-image:linear-gradient(180deg,#fff 0%,#ffd0d0 18%,#ff2a2a 45%,#a00000 70%,#ff6a3a 100%)}
.kanji.k-gold{--glow:#ffc400}.kanji.k-gold span{background-image:linear-gradient(180deg,#fffbe0 0%,#ffe066 25%,#e0a000 50%,#fff2a8 62%,#b07800 100%)}
.kanji.k-blue{--glow:#2ab0ff}.kanji.k-blue span{background-image:linear-gradient(180deg,#fff 0%,#c8f0ff 25%,#22a0ff 55%,#06308a 100%)}
.kanji.k-green{--glow:#22e07a}.kanji.k-green span{background-image:linear-gradient(180deg,#fff 0%,#c8ffe0 25%,#10b860 55%,#04401e 100%)}
.kanji.k-dark{--glow:#8a00ff}.kanji.k-dark span{background-image:linear-gradient(180deg,#e8e8e8 0%,#888 40%,#222 70%,#555 100%)}
.kanji.k-rainbow{--glow:#ff00c8}.kanji.k-rainbow span{background-image:linear-gradient(90deg,#ff004c,#ffb700,#fff200,#44ff00,#00e5ff,#7a00ff,#ff00c8,#ff004c);background-size:200% 100%;animation:kRain .6s linear infinite}
@keyframes kRain{to{background-position:200% 0}}

/* =====================================================================
   THEME: ドパガキ・パーラー（UIと演出の統一）
   ===================================================================== */
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--ink:#fff6dc;--muted:#c9b98a;--accent:#ffd23a;--gold1:#fff6c0;--gold2:#ffd23a;--gold3:#b07800;--g1:rgba(150,40,220,.42);--g2:rgba(255,40,90,.28);--line:rgba(255,210,58,.28);
  --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
body.revmode{--g1:rgba(255,30,120,.6);--g2:rgba(255,120,40,.35);--accent:#ffd23a}
body.ebmode{--g1:rgba(60,100,255,.6);--g2:rgba(0,220,255,.3);--accent:#ffd23a}
body.revmode.ebmode{--g1:rgba(170,60,255,.6);--g2:rgba(255,60,200,.35)}
body.lockmode{--g2:rgba(40,230,120,.35)}
html,body{background:#07050e}
body{background:radial-gradient(ellipse 90% 60% at 50% 38%,var(--g1),transparent 70%),radial-gradient(ellipse 80% 50% at 50% 115%,var(--g2),transparent 70%),#07050e;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(rgba(255,215,90,.16) 1px,transparent 1.6px);background-size:22px 22px;-webkit-mask:radial-gradient(ellipse at 50% 45%,transparent 25%,#000 85%);mask:radial-gradient(ellipse at 50% 45%,transparent 25%,#000 85%)}
#app{position:relative;z-index:1}
/* 金文字（見出し・ロゴ・カットイン・バナーで共通） */
h1,.logo b,.cutin .ttl,.banner,.code{font-family:var(--mincho);font-weight:900}
h1{font-size:26px;color:transparent;background:linear-gradient(180deg,#fffbe0,#ffe066 35%,#d99a00 55%,#fff2a8 70%,#b07800);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 1px #000) drop-shadow(2px 3px 0 rgba(0,0,0,.6)) drop-shadow(0 0 10px rgba(255,190,0,.45));text-shadow:none}
.logo{text-align:center;margin:10px 0 6px;line-height:1}
.logo small{display:block;font-family:var(--mincho);font-weight:900;font-size:18px;color:#ffe9a8;letter-spacing:.3em;text-shadow:0 0 10px rgba(255,200,60,.7)}
.logo b{display:block;font-size:min(96px,24vw);color:transparent;background:linear-gradient(180deg,#fffbe0 0%,#ffe066 28%,#e0a000 50%,#fff2a8 62%,#b07800 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 1px #000) drop-shadow(4px 6px 0 rgba(0,0,0,.7)) drop-shadow(0 0 24px rgba(255,40,160,.7));animation:logoGlow 2.4s ease-in-out infinite}
.logo em{display:block;font-style:normal;font-weight:900;letter-spacing:.45em;font-size:12px;margin-top:6px;color:transparent;background:linear-gradient(90deg,#ff004c,#ffb700,#fff200,#44ff00,#00e5ff,#7a00ff,#ff00c8,#ff004c);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;animation:kRain 2s linear infinite}
@keyframes logoGlow{50%{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 1px #000) drop-shadow(4px 6px 0 rgba(0,0,0,.7)) drop-shadow(0 0 34px rgba(0,200,255,.8))}}
.sub,.note{color:var(--muted)}
.code{color:transparent;background:linear-gradient(180deg,#fffbe0,#ffd23a 55%,#b07800);-webkit-background-clip:text;background-clip:text}
/* パネル・入力 */
.panel{background:linear-gradient(180deg,rgba(28,18,44,.88),rgba(10,6,20,.9));border:1px solid rgba(255,210,58,.45);box-shadow:0 0 0 1px rgba(0,0,0,.6),inset 0 0 24px rgba(255,200,60,.08),0 6px 20px rgba(0,0,0,.5);border-radius:16px}
input{background:#0a0714;border:1px solid rgba(255,210,58,.35);color:#fff6dc}
input:focus{border-color:#ffd23a;box-shadow:0 0 0 3px rgba(255,210,58,.25),0 0 14px rgba(255,210,58,.4)}
label{color:#e8cf86;font-weight:700}
/* ボタン：金メタル／黒ガラス／銀クローム／赤い「出す」 */
button{color:#3a2200;background:linear-gradient(180deg,#fff7c8 0%,#ffd23a 42%,#c88a00 58%,#ffe680 100%);border:1px solid #6b4700;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 3px 0 #6b4700,0 4px 12px rgba(255,190,0,.35);text-shadow:0 1px 0 rgba(255,255,255,.5)}
button:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 0 #6b4700}
button.ghost{background:linear-gradient(180deg,rgba(40,28,60,.9),rgba(14,8,24,.9));color:#ffe9a8;border:1px solid rgba(255,210,58,.5);box-shadow:inset 0 0 10px rgba(255,210,58,.1);text-shadow:none}
button.round{background:radial-gradient(circle at 35% 30%,#3a2c4c,#0b0614);border:2px solid #ffd23a;color:#ffe9a8;box-shadow:0 0 10px rgba(255,210,58,.45),inset 0 0 8px rgba(255,210,58,.25);text-shadow:none}
.mebtns button.passbtn{background:linear-gradient(180deg,#ffffff,#c9ced6 45%,#8a9099 55%,#e6e9ee);color:#1a1a1a;border:1px solid #444;box-shadow:inset 0 1px 0 #fff,0 3px 0 #444}
#play{color:#fff;font-family:var(--mincho);font-weight:900;font-size:17px;letter-spacing:.08em;background:linear-gradient(180deg,#ffb0b0 0%,#ff2a3a 40%,#b00018 60%,#ff5a5a 100%);border:2px solid #ffd23a;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 0 #6b0010,0 0 16px rgba(255,40,60,.6);text-shadow:0 2px 2px rgba(0,0,0,.5)}
#play:disabled{filter:grayscale(.85) brightness(.6);box-shadow:none}
.table.myturn #play:not(:disabled){animation:playPulse .9s ease-in-out infinite}
@keyframes playPulse{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 0 #6b0010,0 0 34px 8px rgba(255,60,80,.9);transform:scale(1.04)}}
.seg button:not(.on),.rule{background:linear-gradient(180deg,rgba(40,28,60,.9),rgba(14,8,24,.9));color:#ffe9a8;border:1px solid rgba(255,210,58,.3);box-shadow:none;text-shadow:none}
.rule.on{background:linear-gradient(180deg,rgba(120,80,0,.55),rgba(50,30,0,.6));border-color:#ffd23a;box-shadow:0 0 12px rgba(255,210,58,.45),inset 0 0 10px rgba(255,210,58,.2)}
.rule small{color:#c9b98a}
.pl{background:linear-gradient(180deg,rgba(40,28,60,.85),rgba(14,8,24,.85));border:1px solid rgba(255,210,58,.3)}
.pl.me{border-color:#ffd23a;box-shadow:0 0 10px rgba(255,210,58,.4)}
.pl.ready{border-color:#44ff88;box-shadow:0 0 10px rgba(68,255,136,.35)}
.badge{background:rgba(255,255,255,.12);color:#ffe9a8}
.badge.gold{background:linear-gradient(180deg,#fff7c8,#ffd23a 50%,#c88a00);color:#3a2200}
.badge.bad{background:linear-gradient(180deg,#7a2b6a,#3a0a30);color:#ffc2e8}
.rank li{font-family:var(--mincho);font-weight:900;font-size:18px}
.rank li:first-child{font-size:22px;color:#ffe066;text-shadow:0 0 12px rgba(255,200,0,.7)}
/* 卓：金のLED枠（自分の番は虹LED） */
.table::before{border:0 !important;padding:3px;border-radius:20px;inset:4px;background:conic-gradient(from var(--a),#ffd23a,#fff6c0,#b07800,#ff2a6a,#ffd23a,#fff6c0,#b07800,#ffd23a);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);box-shadow:none !important;animation:spinA 5s linear infinite;opacity:.9}
@keyframes spinA{to{--a:360deg}}
body.lockmode .table::before{background:repeating-conic-gradient(from var(--a),#dfe6ea 0deg 8deg,#5d6870 8deg 16deg);padding:6px}
.table.myturn::after{inset:3px;border-radius:21px;padding:5px;box-shadow:none;background:conic-gradient(from var(--a),#ff004c,#ffb700,#fff200,#44ff00,#00e5ff,#7a00ff,#ff00c8,#ff004c);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:spinA 1.6s linear infinite;filter:drop-shadow(0 0 8px #fff)}
/* ログ＝LED電光掲示板 */
.ticker{background:linear-gradient(180deg,#0b0712,#120a1c);border:2px solid #ffd23a;box-shadow:0 0 12px rgba(255,210,58,.35),inset 0 0 14px rgba(255,120,0,.15)}
.ticker div{color:#ffb347;text-shadow:0 0 6px rgba(255,150,40,.8)}
.ticker div:last-child{color:#ffe066}
.ticker .rd{color:#ff5ac8;text-shadow:0 0 6px rgba(255,80,200,.8)}
/* 場＝液晶 */
.field{padding:12px 10px;border-radius:18px;min-height:140px;background:radial-gradient(ellipse at 50% 40%,rgba(40,120,255,.28),rgba(8,10,40,.75) 70%);border:2px solid rgba(120,200,255,.45);box-shadow:inset 0 0 30px rgba(60,160,255,.35),0 0 18px rgba(60,160,255,.25)}
.field::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.fieldby{color:#bfe6ff;text-shadow:0 0 6px rgba(80,180,255,.9)}
/* 席：黒×金プレート、金縁アイコン、赤金カード裏 */
.plate{background:linear-gradient(180deg,#2a1e3a,#0c0714);border:2px solid #ffd23a;color:#ffe9a8;box-shadow:0 0 8px rgba(255,210,58,.4),inset 0 1px 0 rgba(255,255,255,.15)}
.seat.turn .plate{background:linear-gradient(180deg,#ff5a6a,#b0001a);color:#fff;border-color:#fff2a8;animation:turnGlow .8s ease-in-out infinite}
@keyframes turnGlow{50%{box-shadow:0 0 18px 6px rgba(255,60,80,.9),0 0 30px rgba(255,210,58,.6)}}
.ava{border:3px solid #ffd23a;outline:2px solid #6b4700;box-shadow:0 0 12px rgba(255,210,58,.45)}
.seat.turn .ava{outline-color:#ff2a3a;box-shadow:0 0 18px rgba(255,60,80,.9)}
.bk,.mini,.flyback{border-color:#ffe066 !important;background:repeating-linear-gradient(45deg,#b0001a 0 3px,#e8102a 3px 6px) !important}
.sstat{background:linear-gradient(180deg,#2a1e3a,#0c0714);border:1px solid rgba(255,210,58,.5);color:#ffe9a8}
.sstat.win{background:linear-gradient(180deg,#fff7c8,#ffd23a 50%,#c88a00);color:#3a2200;border-color:#6b4700}
.sstat.pass{background:#2a2a30;color:#aaa}
.title{background:linear-gradient(180deg,#2a1e3a,#0c0714);border-color:#ffd23a;color:#ffe066;font-family:var(--mincho)}
.title.gold{background:linear-gradient(180deg,#fff7c8,#ffd23a 50%,#c88a00);color:#3a2200}
/* 手札・リボン・ヒント */
.card.sel{box-shadow:0 0 0 3px #ffd23a,0 0 18px 4px rgba(255,60,80,.7),0 6px 14px rgba(0,0,0,.5)}
.card.joker{border:2px solid transparent;background:linear-gradient(160deg,#fff,#f3e3ff) padding-box,linear-gradient(90deg,#ff004c,#ffb700,#44ff00,#00e5ff,#7a00ff) border-box}
.card.dim{filter:brightness(.55) saturate(.6)}
.ribbon{background:linear-gradient(90deg,#ff004c,#ffb700,#fff200,#44ff00,#00e5ff,#7a00ff,#ff00c8,#ff004c);background-size:200% 100%;color:#fff;font-family:var(--mincho);font-size:15px;-webkit-text-stroke:.5px #000;text-shadow:0 1px 2px #000;animation:rib 1s ease-in-out infinite,kRain 1.5s linear infinite;box-shadow:0 0 16px rgba(255,255,255,.6)}
.hint{color:#ffe9a8;text-shadow:0 0 6px rgba(255,200,60,.7),0 1px 2px #000}
.hand.myturn::after{background:radial-gradient(rgba(255,60,120,.5),transparent 70%)}
/* 透かし文字も明朝に */
.wm{font-family:var(--mincho)}

<body>
<div id="app"></div>
<div id="fx"></div>
<div class="toast" id="toast"></div>
<div class="netbar" id="netbar" hidden></div>
<div class="chat" id="chat" hidden><div class="inner">
  <div class="row"><b class="grow">💬 チャット</b><button class="small ghost" id="chatClose">閉じる</button></div>
  <div class="msgs" id="msgs"></div>
  <div class="stamps" id="stamps"></div>
  <form id="chatForm" class="row" autocomplete="off"><input id="chatIn" class="grow" maxlength="80" placeholder="メッセージ" style="width:auto"><button>送信</button></form>
</div></div>
<script>
(() => {
"use strict";
// =====================================================================
// ルールエンジン（純粋関数。オンライン/ソロ共通）
// =====================================================================
const SUITS = ["S","H","D","C"];
const SUIT_SYM = {S:"♠",H:"♥",D:"♦",C:"♣"};
const RANK_LABEL = r => ({11:"J",12:"Q",13:"K",14:"A",15:"2",16:"JK"})[r] || String(r);
const parse = c => ({s:c[0], r:+c.slice(1)});
const isJoker = c => parse(c).r === 16;
const st = (r, rev) => r === 16 ? 100 : (rev ? 18 - r : r);

const RULE_DEFS = [
  {k:"eight",   name:"8切り",     desc:"8を出すと場が流れる"},
  {k:"rev",     name:"革命",      desc:"同じ数字4枚以上で強さ逆転"},
  {k:"seq",     name:"階段",      desc:"同じマーク3枚以上の連番"},
  {k:"spade3",  name:"スペ3返し", desc:"単体ジョーカーに♠3が勝つ"},
  {k:"eb",      name:"11バック",  desc:"Jで場が流れるまで逆転"},
  {k:"shibari", name:"縛り",      desc:"同じマークが続くと固定"},
  {k:"five",    name:"5スキップ", desc:"5の枚数だけ次を飛ばす"},
  {k:"miyako",  name:"都落ち",    desc:"大富豪が1位を逃すと最下位"},
  {k:"foul",    name:"反則上がり",desc:"JK・2・8で上がると最下位"},
  {k:"seven",   name:"7渡し",     desc:"7の枚数だけ次の人に渡す"},
  {k:"bomb",    name:"12ボンバー",desc:"Qの枚数だけ数字を指定→全員捨てる"},
  {k:"exchange",name:"カード交換",desc:"2戦目から階級で交換"},
];
const MAX_PLAYERS = 10;
const DEFAULT_RULES = {eight:true,rev:true,seq:true,spade3:true,eb:false,shibari:false,five:false,miyako:false,foul:false,seven:false,bomb:false,exchange:true,jokers:1};
const PRESETS = {
  "定番": {...DEFAULT_RULES},
  "全部盛り": {eight:true,rev:true,seq:true,spade3:true,eb:true,shibari:true,five:true,miyako:true,foul:true,seven:true,bomb:true,exchange:true,jokers:2},
  "シンプル": {eight:false,rev:false,seq:false,spade3:false,eb:false,shibari:false,five:false,miyako:false,foul:false,seven:false,bomb:false,exchange:false,jokers:1},
};

function titlesFor(n){
  if(n<=1) return ["大富豪"];
  if(n===2) return ["大富豪","大貧民"];
  if(n===3) return ["大富豪","平民","大貧民"];
  const t = Array(n).fill("平民");
  t[0]="大富豪"; t[1]="富豪"; t[n-2]="貧民"; t[n-1]="大貧民";
  return t;
}
function newDeck(jokers){
  const d=[];
  for(const s of SUITS) for(let r=3;r<=15;r++) d.push(s+r);
  if(jokers>=1) d.push("X16");
  if(jokers>=2) d.push("W16");
  for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];}
  return d;
}
function sortHand(h, rev){
  return h.slice().sort((a,b)=>{const A=parse(a),B=parse(b);return st(A.r,rev)-st(B.r,rev)||SUITS.indexOf(A.s)-SUITS.indexOf(B.s);});
}
const effRev = s => !!s.rev !== !!s.eb;
const suitsOf = cards => cards.filter(c=>!isJoker(c)).map(c=>c[0]).sort();

function analyze(cards, rules){
  if(!cards.length) return null;
  const ps = cards.map(parse);
  const nonJ = ps.filter(p=>p.r!==16);
  const n = cards.length;
  if(nonJ.every(p=>p.r===(nonJ[0]||{}).r)) return {type:"group", n, rank: nonJ.length? nonJ[0].r : 16};
  if(rules.seq && n>=3 && nonJ.length===n && ps.every(p=>p.s===ps[0].s)){
    const rs = ps.map(p=>p.r).sort((a,b)=>a-b);
    for(let i=1;i<rs.length;i++) if(rs[i]!==rs[i-1]+1) return null;
    return {type:"seq", n, min:rs[0], max:rs[rs.length-1]};
  }
  return null;
}

// 出せるなら ""、出せないなら理由
function canPlay(s, pid, cards){
  if(s.phase!=="play" || s.turn!==pid) return "あなたの番じゃない";
  if(s.pending) return "選択中";
  if(!cards.length) return "カードを選んでね";
  const hand = s.hands[pid]||[];
  if(new Set(cards).size!==cards.length || !cards.every(c=>hand.includes(c))) return "手札にないカード";
  const info = analyze(cards, s.rules);
  if(!info) return "その組み合わせは出せない";
  const f = s.field, rev = effRev(s);
  if(f){
    if(info.type!==f.type || info.n!==f.n) return `場と同じ${f.n}枚の${f.type==="seq"?"階段":"組"}で出してね`;
    if(info.type==="group"){
      const sp3 = s.rules.spade3 && f.rank===16 && f.n===1 && cards[0]==="S3";
      if(!sp3 && !(st(info.rank,rev) > st(f.rank,rev))) return "場より強くない";
    } else {
      if(!(rev ? info.max < f.min : info.min > f.max)) return "場より強くない";
    }
    if(s.lock){
      const su = suitsOf(cards);
      if(!su.every(x=>s.lock.includes(x))) return `縛り中（${s.lock.map(x=>SUIT_SYM[x]).join("")}のみ）`;
    }
  }
  return "";
}

const outSet = s => new Set([...s.finished, ...s.losers]);
const activeOf = s => { const o=outSet(s); return s.order.filter(p=>!o.has(p)); };
const nameOf = (s,id) => (s.players.find(p=>p.id===id)||{}).name || "?";
function nextFrom(s, pid, skipPassed){
  const o=s.order, i=o.indexOf(pid), out=outSet(s);
  for(let k=1;k<=o.length;k++){
    const q=o[(i+k)%o.length];
    if(out.has(q)) continue;
    if(skipPassed && s.passed.includes(q)) continue;
    return q;
  }
  return null;
}
function log(s,msg){ s.log.push(msg); if(s.log.length>10) s.log=s.log.slice(-10); }
function fx(s, k, extra){ (s.fxk=s.fxk||[]).push({k, ...(extra||{})}); }
function cardText(c){const p=parse(c); return p.r===16?"🃏":SUIT_SYM[p.s]+RANK_LABEL(p.r);}
function clearField(s){ s.field=null; s.passed=[]; s.eb=false; s.lock=null; }

function blankRoom(hostId){
  return {v:0, host:hostId, players:[], phase:"lobby", order:[], hands:{}, counts:{}, field:null, rev:false, eb:false, lock:null,
          turn:null, passed:[], finished:[], losers:[], ranking:[], lastPlayer:null, log:[], round:0, titles:{}, prevFinish:[],
          rules:{...DEFAULT_RULES}, fx:{n:0,k:[]}, updatedAt:Date.now()};
}

function startRound(s){
  const ids = s.players.map(p=>p.id);
  s.order = ids.slice();
  s.hands = {}; ids.forEach(id=>s.hands[id]=[]);
  const d = newDeck(s.rules.jokers);
  const off = Math.floor(Math.random()*ids.length);
  d.forEach((c,i)=>s.hands[ids[(i+off)%ids.length]].push(c));
  s.rev=false; clearField(s); s.finished=[]; s.losers=[]; s.ranking=[]; s.lastPlayer=null; s.pending=null; s.after=null;
  s.players.forEach(p=>{ p.ready=false; delete p.wait; });
  s.round=(s.round||0)+1; s.log=[];
  log(s,`第${s.round}ラウンド開始`);
  fx(s,"round",{n:s.round});
  const prev = s.prevFinish||[];
  const same = prev.length===ids.length && prev.every(id=>ids.includes(id));
  s.sameMembers = same && s.round>1;
  if(s.sameMembers && s.rules.exchange && ids.length>=2){
    const N=ids.length;
    const pairs=[[prev[0],prev[N-1],N>=3?2:1]];
    if(N>=4) pairs.push([prev[1],prev[N-2],1]);
    for(const [rich,poor,k] of pairs){
      const strong = sortHand(s.hands[poor],false).slice(-k);
      const weak = sortHand(s.hands[rich].filter(c=>!strong.includes(c)),false).slice(0,k);
      s.hands[poor]=s.hands[poor].filter(c=>!strong.includes(c)).concat(weak);
      s.hands[rich]=s.hands[rich].filter(c=>!weak.includes(c)).concat(strong);
      log(s,`交換: ${nameOf(s,poor)}→${nameOf(s,rich)} ${k}枚`);
    }
  }
  s.turn = s.sameMembers ? prev[prev.length-1] : (ids.find(id=>s.hands[id].includes("D3")) || ids[0]);
  log(s,`${nameOf(s,s.turn)} から開始`);
  s.phase="play";
}

function endRound(s){
  const rank = s.finished.concat(activeOf(s), s.losers.slice().reverse());
  s.ranking = rank; s.prevFinish = rank.slice();
  const t = titlesFor(rank.length);
  s.titles = {}; rank.forEach((id,i)=>s.titles[id]=t[i]);
  s.phase="result"; clearField(s); s.rev=false; s.pending=null; s.after=null;
  log(s,"ラウンド終了");
  fx(s,"end",{king:rank[0]});
}

function doPlay(s,pid,cards){
  const err = canPlay(s,pid,cards);
  if(err) return err;
  const prev = s.field, R = s.rules;
  const info = analyze(cards, R);
  s.hands[pid]=s.hands[pid].filter(c=>!cards.includes(c));
  s.field={cards, ...info, by:pid};
  s.lastPlayer=pid; s.passed=[];
  log(s,`${nameOf(s,pid)}: ${cards.map(cardText).join(" ")}`);
  fx(s,"play",{id:pid,cards});
  const has = r => cards.some(c=>parse(c).r===r);
  if(R.rev && info.type==="group" && info.n>=4){ s.rev=!s.rev; log(s, s.rev?"⚡ 革命！":"⚡ 革命返し！"); fx(s,"rev",{on:s.rev, who:nameOf(s,pid)}); }
  if(R.shibari && prev && !s.lock){
    const a=suitsOf(cards), b=suitsOf(prev.cards);
    if(a.length===cards.length && b.length===prev.cards.length && a.join()===b.join()){
      s.lock=a; log(s,`🔒 縛り ${a.map(x=>SUIT_SYM[x]).join("")}`); fx(s,"lock",{suits:a.map(x=>SUIT_SYM[x]).join(""), red:a.some(x=>x==="H"||x==="D"), who:nameOf(s,pid)});
    }
  }
  const eight = R.eight && has(8);
  if(R.eb && !eight && has(11)){ s.eb=!s.eb; log(s,"↩ 11バック"); fx(s,"eb",{on:s.eb, who:nameOf(s,pid)}); }
  if(!s.hands[pid].length){
    const strongest = effRev(s) ? 3 : 15;
    const foul = R.foul && (cards.some(isJoker) || (R.eight && has(8)) || has(strongest));
    if(foul){
      s.losers.push(pid); log(s,`🚫 ${nameOf(s,pid)} 反則上がり`); fx(s,"foul",{who:nameOf(s,pid)});
    } else {
      s.finished.push(pid); log(s,`🎉 ${nameOf(s,pid)} 上がり（${s.finished.length}位）`);
      fx(s,"finish",{who:nameOf(s,pid), place:s.finished.length, id:pid});
      const king = (s.prevFinish||[])[0];
      if(R.miyako && s.sameMembers && s.finished.length===1 && king && king!==pid && activeOf(s).includes(king)){
        s.losers.push(king); log(s,`🏚 都落ち: ${nameOf(s,king)}`); fx(s,"miyako",{who:nameOf(s,king)});
      }
    }
  }
  if(activeOf(s).length<=1){ endRound(s); return true; }
  const cnt = r => cards.filter(c=>parse(c).r===r).length;
  s.after = {pid, eight, five: R.five ? cnt(5) : 0};
  const q=[];
  if(R.seven && cnt(7) && s.hands[pid].length) q.push({type:"seven", n:Math.min(cnt(7), s.hands[pid].length)});
  if(R.bomb && cnt(12)) q.push({type:"bomb", n:cnt(12)});
  s.pendingQ=q;
  nextPending(s);
  return true;
}

// 7渡し・12ボンバーの選択待ちを順に処理
function nextPending(s){
  const q=s.pendingQ||[];
  if(q.length){
    s.pending={...q.shift(), pid:s.after.pid}; s.pendingQ=q;
    s.turn=s.after.pid;
    if(s.pending.type==="seven") s.pending.to = nextFrom(s,s.after.pid,false);
    if(s.pending.type==="seven" && (!s.pending.to || s.pending.to===s.after.pid)) return nextPending(s);
    fx(s,"pending",{type:s.pending.type});
    return;
  }
  s.pending=null; s.pendingQ=[];
  resolveAfter(s);
}
function finishIfEmpty(s,pid){
  if(!s.hands[pid].length && !outSet(s).has(pid)){
    s.finished.push(pid); log(s,`🎉 ${nameOf(s,pid)} 上がり（${s.finished.length}位）`);
    fx(s,"finish",{who:nameOf(s,pid), place:s.finished.length, id:pid});
  }
}
function resolveAfter(s){
  const A=s.after||{}, pid=A.pid; s.after=null;
  if(activeOf(s).length<=1){ endRound(s); return; }
  if(A.eight){
    clearField(s); log(s,"✂ 8切り"); fx(s,"eight",{who:nameOf(s,pid)});
    s.turn = activeOf(s).includes(pid) ? pid : nextFrom(s,pid,false);
    return;
  }
  let nx = nextFrom(s,pid,true);
  if(A.five){
    for(let i=0;i<A.five;i++) nx = nextFrom(s,nx,true);
    log(s,`⏭ ${A.five}人スキップ`); fx(s,"skip",{n:A.five, who:nameOf(s,pid)});
  }
  if(!nx){ // 全員パス済みなどで次がいない→場を流す
    const lp=s.lastPlayer; clearField(s);
    nx = activeOf(s).includes(lp) ? lp : nextFrom(s,lp,false);
  }
  s.turn = nx;
}
function doGive(s,pid,cards){
  const P=s.pending;
  if(!P || P.type!=="seven" || P.pid!==pid) return "今は渡せない";
  if(new Set(cards).size!==cards.length || cards.length!==P.n || !cards.every(c=>s.hands[pid].includes(c))) return `${P.n}枚選んでね`;
  s.hands[pid]=s.hands[pid].filter(c=>!cards.includes(c));
  s.hands[P.to]=s.hands[P.to].concat(cards);
  log(s,`🎁 ${nameOf(s,pid)} → ${nameOf(s,P.to)} に${P.n}枚渡した`);
  fx(s,"seven",{from:pid,to:P.to,n:P.n});
  finishIfEmpty(s,pid);
  nextPending(s);
  return true;
}
function doBomb(s,pid,ranks){
  const P=s.pending;
  if(!P || P.type!=="bomb" || P.pid!==pid) return "今は選べない";
  ranks=[...new Set(ranks.map(Number))].filter(r=>r>=3&&r<=16);
  if(ranks.length!==P.n) return `数字を${P.n}つ選んでね`;
  let total=0;
  for(const id of activeOf(s)){
    const before=s.hands[id].length;
    s.hands[id]=s.hands[id].filter(c=>!ranks.includes(parse(c).r));
    total+=before-s.hands[id].length;
  }
  log(s,`💣 ${nameOf(s,pid)} の12ボンバー: ${ranks.map(RANK_LABEL).join("・")}（${total}枚消滅）`);
  fx(s,"bomb",{ranks:ranks.map(RANK_LABEL).join("・"),total, who:nameOf(s,pid)});
  const o=s.order, i=o.indexOf(pid);
  for(let k=0;k<o.length;k++){ const id=o[(i+k)%o.length]; if(activeOf(s).includes(id)) finishIfEmpty(s,id); }
  nextPending(s);
  return true;
}
function botPending(s){
  const P=s.pending, hand=s.hands[P.pid];
  if(P.type==="seven") return doGive(s,P.pid,sortHand(hand,effRev(s)).slice(0,P.n));
  const rev=effRev(s), mine=new Set(hand.map(c=>parse(c).r));
  const all=[16,...Array.from({length:13},(_,i)=>i+3)].sort((a,b)=>st(b,rev)-st(a,rev));
  const pick=all.filter(r=>!mine.has(r)).concat(all.filter(r=>mine.has(r))).slice(0,P.n);
  return doBomb(s,P.pid,pick);
}

function doPass(s,pid){
  if(s.phase!=="play" || s.turn!==pid) return "あなたの番じゃない";
  if(s.pending) return "選択中";
  if(!s.field) return "親はパスできない";
  s.passed.push(pid);
  log(s,`${nameOf(s,pid)}: パス`);
  fx(s,"pass",{id:pid});
  const others = activeOf(s).filter(p=>p!==s.lastPlayer);
  if(others.every(p=>s.passed.includes(p))){
    const lp = s.lastPlayer;
    clearField(s);
    s.turn = activeOf(s).includes(lp) ? lp : nextFrom(s,lp,false);
    log(s,"場が流れた"); fx(s,"clear");
  } else {
    s.turn = nextFrom(s,pid,true);
  }
  return true;
}

// ---------------- CPU ----------------
function combos(arr,k){
  const out=[]; const rec=(i,acc)=>{ if(acc.length===k){out.push(acc.slice());return;} for(let j=i;j<arr.length;j++){acc.push(arr[j]);rec(j+1,acc);acc.pop();} };
  rec(0,[]); return out;
}
function candidates(s,pid){
  if(s.pending || s.turn!==pid) return [];
  const hand=s.hands[pid]||[], R=s.rules;
  const jokers=hand.filter(isJoker);
  const byRank={};
  hand.forEach(c=>{const p=parse(c); if(p.r!==16)(byRank[p.r]=byRank[p.r]||[]).push(c);});
  const f=s.field, cands=[];
  const sizes = f ? (f.type==="group"?[f.n]:[]) : [1,2,3,4,5,6];
  for(const r in byRank){
    const cs=byRank[r];
    for(const n of sizes){
      for(let j=0;j<=Math.min(jokers.length,n-1);j++){
        const k=n-j; if(k>cs.length||k<1) continue;
        for(const cb of combos(cs,k)) cands.push(cb.concat(jokers.slice(0,j)));
      }
    }
  }
  for(let j=1;j<=jokers.length;j++) if(sizes.includes(j)) cands.push(jokers.slice(0,j));
  if(R.seq && (!f || f.type==="seq")){
    for(const su of SUITS){
      const rs=hand.filter(c=>c[0]===su && !isJoker(c)).map(c=>parse(c).r).sort((a,b)=>a-b);
      const lens = f ? [f.n] : [3,4,5];
      for(const L of lens) for(let i=0;i+L<=rs.length;i++){
        const w=rs.slice(i,i+L); if(w[L-1]-w[0]===L-1) cands.push(w.map(r=>su+r));
      }
    }
  }
  return cands.filter(c=>!canPlay(s,pid,c));
}
function botMove(s,pid){
  const cands=candidates(s,pid);
  if(!cands.length) return null;
  const rev=effRev(s), hand=s.hands[pid];
  const score = c => {
    const info=analyze(c,s.rules);
    const base = info.type==="seq" ? st(rev?info.max:info.min,rev) : st(info.rank,rev);
    const j=c.filter(isJoker).length;
    let sc = base*10 + j*60;
    if(!s.field) sc -= c.length*6;           // 親なら枚数多めで捨てたい
    if(c.length===hand.length) sc -= 1000;   // 上がれるなら上がる
    if(s.rules.foul && c.length===hand.length && (j || c.some(x=>parse(x).r===(rev?3:15)) || (s.rules.eight&&c.some(x=>parse(x).r===8)))) sc += 3000;
    return sc;
  };
  cands.sort((a,b)=>score(a)-score(b));
  const best=cands[0];
  if(s.field && hand.length>5 && best.some(isJoker) && Math.random()<.6) return null;
  if(s.field && hand.length>6 && st(analyze(best,s.rules).rank||0,rev)>=14 && Math.random()<.35) return null;
  return best;
}

function replaceId(s, oldId, newId){
  s.players.forEach(p=>{ if(p.id===oldId) p.id=newId; });
  const rep = a => (a||[]).map(x=>x===oldId?newId:x);
  ["order","passed","finished","losers","ranking","prevFinish"].forEach(k=>s[k]=rep(s[k]));
  for(const k of ["hands","titles","counts"]) if(s[k] && s[k][oldId]!==undefined){ s[k][newId]=s[k][oldId]; delete s[k][oldId]; }
  ["turn","lastPlayer","host"].forEach(k=>{ if(s[k]===oldId) s[k]=newId; });
  if(s.field && s.field.by===oldId) s.field.by=newId;
  if(s.pending){ if(s.pending.pid===oldId) s.pending.pid=newId; if(s.pending.to===oldId) s.pending.to=newId; }
  if(s.after && s.after.pid===oldId) s.after.pid=newId;
}
let botSeq=0;
const BOT_NAMES=["タロウ","ハナコ","ジロウ","サクラ","ケンタ","ミドリ","ゴロウ","モモ","リク","ユイ"];
function addBot(s){
  if(s.players.length>=MAX_PLAYERS) return `最大${MAX_PLAYERS}人`;
  const used=s.players.map(p=>p.name);
  const nm=BOT_NAMES.find(b=>!used.includes("CPU "+b))||"X";
  s.players.push({id:"b"+Date.now().toString(36)+(botSeq++)+Math.random().toString(36).slice(2,5),name:"CPU "+nm,bot:true});
  return true;
}

function applyAction(s, actor, a){
  s.fxk=[];
  const host = actor===s.host;
  let r=false;
  switch(a && a.t){
    case "join": {
      const name=String(a.name||"").slice(0,10)||"名無し";
      const me=s.players.find(p=>p.id===actor);
      if(me){ if(me.away){ me.away=false; me.bot=false; log(s,`${me.name} が復帰`); r=true; } break; }
      const same=s.players.find(p=>p.name===name);
      if(same && same.away){ replaceId(s,same.id,actor); same.bot=false; same.away=false; log(s,`${name} が復帰`); r=true; break; }
      if(same){ r="同じ名前の人がいるよ（別の名前にしてね）"; break; }
      if(s.phase==="play"){
        // 途中参加: 抜けた人の席→まだ残ってるCPUの席→観戦（次ラウンドから）
        const out=outSet(s);
        const seat = s.players.find(p=>p.away && s.order.includes(p.id) && !out.has(p.id))
                  || s.players.find(p=>p.bot && s.order.includes(p.id) && !out.has(p.id));
        if(seat){
          const old=seat.name; replaceId(s,seat.id,actor);
          seat.bot=false; seat.away=false; seat.name=name;
          log(s,`${name} が途中参加（${old}の席）`); fx(s,"join",{who:name}); r=true; break;
        }
      }
      if(s.players.length>=MAX_PLAYERS){ r=`満員（${MAX_PLAYERS}人）です`; break; }
      if(!s.players.some(p=>!p.bot)) s.host=actor;
      s.players.push({id:actor,name,bot:false,ready:false, ...(s.phase==="play"?{wait:true}:{})});
      log(s, s.phase==="play" ? `${name} が観戦中（次のラウンドから参加）` : `${name} が入室`); fx(s,"join",{who:name}); r=true; break;
    }
    case "leave": {
      const p=s.players.find(x=>x.id===actor); if(!p) break;
      if(s.phase==="play" && s.order.includes(p.id)){ p.bot=true; p.away=true; log(s,`${p.name} が抜けた（CPUが代打ち）`); }
      else { s.players=s.players.filter(x=>x.id!==actor); s.ranking=s.ranking.filter(x=>x!==actor); log(s,`${p.name} が退出`); }
      if(s.host===actor){ const h=s.players.find(x=>!x.bot); if(h) s.host=h.id; }
      r=true; break;
    }
    case "drop": {   // ホスト専用: 接続が死んでる人を片付ける
      if(!host || a.id===s.host) break;
      const p=s.players.find(x=>x.id===a.id); if(!p) break;
      if(s.phase==="play" && s.order.includes(p.id)){ if(!p.away){ p.bot=true; p.away=true; log(s,`${p.name} の接続が切れた（CPUが代打ち）`); r=true; } }
      else { s.players=s.players.filter(x=>x.id!==p.id); s.ranking=(s.ranking||[]).filter(x=>x!==p.id); r=true; }
      break;
    }
    case "addbot": if(host && s.phase!=="play") r=addBot(s); break;
    case "rm": if(host && s.phase!=="play" && a.id!==actor){ const n=s.players.length; s.players=s.players.filter(p=>p.id!==a.id); s.ranking=s.ranking.filter(x=>x!==a.id); r=s.players.length!==n; } break;
    case "tobot": if(host && s.phase==="play"){ const p=s.players.find(x=>x.id===a.id); if(p&&!p.bot){ p.bot=true; p.away=true; log(s,`${p.name} をCPUに交代`); r=true; } } break;
    case "rules": if(host && s.phase!=="play"){
      const nr={...s.rules};
      for(const d of RULE_DEFS) if(a.rules && typeof a.rules[d.k]==="boolean") nr[d.k]=a.rules[d.k];
      if(a.rules && [0,1,2].includes(a.rules.jokers)) nr.jokers=a.rules.jokers;
      s.rules=nr; r=true; } break;
    case "start": case "next": {
      if(!host || s.phase==="play" || s.players.length<2) break;
      const notReady=s.players.filter(p=>!p.bot && p.id!==s.host && !p.ready);
      if(notReady.length && !a.force){ r=`${notReady.map(p=>p.name).join("、")} の準備待ち`; break; }
      startRound(s); r=true; break;
    }
    case "ready": { const p=s.players.find(x=>x.id===actor); if(p && s.phase!=="play"){ p.ready=!!a.v; r=true; } break; }
    case "chat": {
      const p=s.players.find(x=>x.id===actor); const text=String(a.text||"").replace(/[\u0000-\u001f]/g," ").trim().slice(0,80);
      if(!p || !text) break;
      s.chat=(s.chat||[]).concat({id:(s.chatN=(s.chatN||0)+1), by:actor, name:p.name, text}).slice(-40);
      r=true; break;
    }
    case "give": r=doGive(s,actor,Array.isArray(a.cards)?a.cards.map(String):[]); break;
    case "bomb": r=doBomb(s,actor,Array.isArray(a.ranks)?a.ranks:[]); break;
    case "play": r=doPlay(s,actor,Array.isArray(a.cards)?a.cards.map(String):[]); break;
    case "pass": r=doPass(s,actor); break;
    case "bot": {
      if(!host || s.phase!=="play") break;
      const p=s.players.find(x=>x.id===s.turn); if(!p||!p.bot) break;
      if(s.pending){ r=botPending(s); break; }
      const mv=botMove(s,p.id);
      r = mv ? doPlay(s,p.id,mv) : (s.field ? doPass(s,p.id) : doPlay(s,p.id,[sortHand(s.hands[p.id],effRev(s))[0]]));
      break;
    }
  }
  if(r===true){
    s.v=(s.v||0)+1; s.updatedAt=Date.now();
    s.counts={}; for(const id in s.hands) s.counts[id]=s.hands[id].length;
    if(s.fxk.length) s.fx={n:((s.fx&&s.fx.n)||0)+1, k:s.fxk};
  }
  delete s.fxk;
  return r;
}

async function makeAvatar(file){

    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const N=96, c=document.createElement("canvas"); c.width=c.height=N;
    const g=c.getContext("2d"), m=Math.min(img.naturalWidth,img.naturalHeight);
    g.drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,N,N);
    let q=.82, d=c.toDataURL("image/jpeg",q);
    while(d.length>30000 && q>.4){ q-=.12; d=c.toDataURL("image/jpeg",q); }
    return d;
  } finally { URL.revokeObjectURL(url); }
}

// ---- P2P（自前ホスティング時） ----
// 合言葉 → peer ID。まずホストを試し（成否が即返る）、部屋があればクライアントとして入る。
// ・クライアントは4秒ごとにping、ホストは25秒無音の接続を切る（幽霊対策）
// ・クライアントは切れたら自動で再接続（最大30秒）。この間は新しい部屋を作らない
// ・ホストのシグナリングが切れてIDを取られたら、取った側（空の部屋）に状態ごと合流する
const ICE_SERVERS = [
  {urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302","stun:stun2.l.google.com:19302"]},
  {urls:"stun:stun.cloudflare.com:3478"},
  {urls:["turn:eu-0.turn.peerjs.com:3478","turn:us-0.turn.peerjs.com:3478"], username:"peerjs", credential:"peerjsp"},
  // ↓ 無料TURN（Metered / ExpressTURN など）の認証情報をここに足すと、モバイル回線どうしでもつながりやすくなる
  // {urls:["turn:example.com:80","turn:example.com:443?transport=tcp"], username:"xxxx", credential:"xxxx"},
];
const PEER_OPTS = () => ({debug:0, config:{iceServers:ICE_SERVERS}, ...(window.__DFG_PEER_OPTS__||{})});
let connStatus="", myName="", roomPeerId="", joinGen=0, clientTries=0;
let rejoinUntil=0, kicked=false, lastHostMsg=0, hbTimer=null;
function setStatus(m){ connStatus=m; if(!S && screen==="room") render(); }
function netBar(msg){
  const b=document.getElementById("netbar"); if(!b) return;
  if(msg){ b.textContent="🔄 "+msg; b.hidden=false; } else b.hidden=true;
}
function hostApply(actor,a){
  const s=clone(S); const r=applyAction(s,actor,a);
  if(r===true){ S=s; broadcast(); render(); driveBots(); }
  else if(typeof r==="string" && actor===myId) toast(r);
  return r;
}
function sendState(c){ if(c.open){ try{ c.send({state:viewFor(S,c.pid)}); }catch(e){} } }
function broadcast(){ for(const c of conns.values()) sendState(c); }
const liveConn = id => { const c=conns.get(id); return c && c.open && Date.now()-(c.lastSeen||0) < 12000; };

function setupHostConn(c){
  c.lastSeen=Date.now();
  c.on("data", m=>{
    if(!m || typeof m!=="object" || !S) return;
    c.lastSeen=Date.now();
    if(m.t==="ping"){ try{ c.send({pong:1}); }catch(e){} return; }
    if(m.t==="merge"){ handleMerge(c,m); return; }
    if(m.t==="join"){
      const pid=String(m.id||"").slice(0,40); if(!pid) return;
      c.pid=pid;
      const old=conns.get(pid); conns.set(pid,c);
      if(old && old!==c){ try{ old.send({kicked:1}); }catch(e){} setTimeout(()=>{ try{ old.close(); }catch(e){} },150); }
      // 同じ名前で、接続が死んでる「幽霊」は片付けてから入れる
      const nm=String(m.name||"").slice(0,10);
      const ghost=S.players.find(p=>p.name===nm && p.id!==pid && p.id!==myId && !p.bot && !liveConn(p.id));
      if(ghost){ const gc=conns.get(ghost.id); if(gc){ conns.delete(ghost.id); try{gc.close()}catch(e){} } hostApply(myId,{t:"drop",id:ghost.id}); }
      try{ c.send({avatars:{...avatars}}); }catch(e){}
    }
    if(!c.pid) return;
    if(m.t==="avatar"){
      const d=okAvatar(m.data)?m.data:"";
      if(d) avatars[c.pid]=d; else delete avatars[c.pid];
      for(const x of conns.values()) if(x.open) try{ x.send({avatars:{[c.pid]:d}}); }catch(e){}
      render(); return;
    }
    const r=hostApply(c.pid,m);
    if(typeof r==="string"){ try{ c.send({err:r, fatal:m.t==="join"}); }catch(e){} }
    else if(r===false && m.t==="join") sendState(c);
  });
  c.on("close", ()=>dropConn(c));
  c.on("error", ()=>{});
}
function dropConn(c){ if(c.pid && conns.get(c.pid)===c){ conns.delete(c.pid); if(S && p2pHost) hostApply(c.pid,{t:"leave"}); } }
function hostWatchdog(gen){
  clearInterval(hbTimer);
  hbTimer=setInterval(()=>{
    if(gen!==joinGen || !p2pHost){ clearInterval(hbTimer); return; }
    for(const c of [...conns.values()]) if(Date.now()-(c.lastSeen||0) > 25000){ try{ c.close(); }catch(e){} dropConn(c); }
  },5000);
}

function becomeHost(state, gen){
  setStatus(state ? "ホストを引き継ぎ中…" : "部屋を作成中…");
  let tries=0;
  const attempt=()=>{
    if(gen!==joinGen) return;
    const p=new window.Peer(roomPeerId, PEER_OPTS()); peer=p;
    p.on("open", ()=>{
      if(gen!==joinGen){ try{p.destroy()}catch(e){} return; }
      if(p2pHost) { netBar(""); return; }        // シグナリング再接続
      p2pHost=true; rejoinUntil=0; clearTimeout(loadTimer); netBar(""); hostWatchdog(gen);
      if(state){ S=state; render(); driveBots(); toast("ホストを引き継いだよ"); }
      else { S=blankRoom(myId); hostApply(myId,{t:"join",name:myName}); }
    });
    p.on("connection", setupHostConn);
    p.on("disconnected", ()=>{ if(gen!==joinGen) return; setTimeout(()=>{ try{ if(!p.destroyed) p.reconnect(); }catch(e){} },1000); });
    p.on("error", e=>{
      if(gen!==joinGen) return;
      if(e.type==="unavailable-id"){
        if(p2pHost && S){ recoverLostId(gen); return; }          // ホスト中にIDを取られた
        try{p.destroy()}catch(_){}
        if(state){ if(++tries<15) setTimeout(attempt,1000); else failP2P("ホストを引き継げませんでした"); }
        else startClient(gen);                                     // 部屋がある→そこに入る
      } else if(!p2pHost){
        try{p.destroy()}catch(_){}
        if(++tries<4) setTimeout(attempt,900); else failP2P(netErrMsg(e));
      } else if(e.type==="network" || e.type==="server-error" || e.type==="socket-error" || e.type==="socket-closed"){
        setTimeout(()=>{ try{ if(!p.destroyed) p.reconnect(); }catch(_){} },2000);
      }
    });
  };
  attempt();
}
function netErrMsg(e){
  const t=e&&e.type;
  if(t==="network"||t==="server-error"||t==="socket-error"||t==="socket-closed") return "接続サーバーにつながらなかった（電波を確認してもう一度）";
  if(t==="browser-incompatible") return "このブラウザは非対応みたい";
  return "接続できませんでした（"+t+"）";
}

function startClient(gen){
  if(gen!==joinGen) return;
  setStatus(rejoinUntil ? "再接続中…" : "部屋を探してる…");
  const p=new window.Peer(PEER_OPTS()); peer=p;
  p.on("open", ()=>connectHost(p,gen));
  p.on("disconnected", ()=>{ try{ if(!p.destroyed) p.reconnect(); }catch(e){} });
  p.on("error", e=>{
    if(gen!==joinGen) return;
    try{p.destroy()}catch(_){}
    if(e.type==="peer-unavailable"){
      if(Date.now()<rejoinUntil){ netBar("ホストを探してる…"); setTimeout(()=>startClient(gen),1500); }
      else if(S && rejoinUntil){ failP2P("ホストが見つからなくなりました（ホストが閉じたかも）"); }
      else becomeHost(null, gen);                                 // 部屋がまだ無い→自分がホスト
    } else if(Date.now()<rejoinUntil){ setTimeout(()=>startClient(gen),1500); }
    else if(!S && ++clientTries<4){ setTimeout(()=>startClient(gen),900); }
    else failP2P(netErrMsg(e));
  });
}
function connectHost(p,gen){
  setStatus(rejoinUntil ? "再接続中…" : "部屋に接続中…");
  const c=p.connect(roomPeerId,{reliable:true}); conn=c;
  const to=setTimeout(()=>{
    if(gen!==joinGen || c.open) return;
    try{c.close()}catch(e){} try{p.destroy()}catch(e){}
    if(Date.now()<rejoinUntil || ++clientTries<4) startClient(gen);
    else failP2P("ホストに直接つながらなかった（回線の相性かも。Wi-Fi⇔モバイル回線を切り替えて試してみて）");
  }, 9000);
  c.on("open", ()=>{
    clearTimeout(to); clientTries=0; rejoinUntil=0; lastHostMsg=Date.now(); netBar("");
    c.send({t:"join",name:myName,id:myId}); if(myAvatar) c.send({t:"avatar",data:myAvatar});
    clientHeartbeat(gen,c);
  });
  c.on("data", m=>{
    if(gen!==joinGen || !m) return;
    lastHostMsg=Date.now();
    if(m.pong) return;
    if(m.kicked){ kicked=true; failP2P("別の画面で入り直したので、こっちは切断したよ"); return; }
    if(m.avatars){ mergeAvatars(m.avatars); return; }
    if(m.state){ S=m.state; clearTimeout(loadTimer); render(); }
    else if(m.err){ if(m.fatal) failP2P(m.err); else toast(m.err); }
    else if(m.migrate){
      rejoinUntil=Date.now()+30000;
      if(m.migrate===myId && m.full){ const st=m.full; c.__handoff=true; try{c.close()}catch(e){} try{p.destroy()}catch(e){} becomeHost(st,gen); }
      else netBar("ホストが交代中…");
    }
  });
  c.on("close", ()=>{
    clearTimeout(to);
    if(gen!==joinGen || mode!=="online" || p2pHost || c.__handoff || kicked || c!==conn) return;
    startRejoin(gen);
  });
  c.on("error", ()=>{});
}
function startRejoin(gen){
  if(gen!==joinGen || p2pHost || kicked) return;
  if(!rejoinUntil || Date.now()>rejoinUntil) rejoinUntil=Date.now()+30000;
  netBar("再接続中…");
  const old=conn; conn=null; if(old){ old.__handoff=true; try{old.close()}catch(e){} }
  try{ peer && peer.destroy(); }catch(e){}
  setTimeout(()=>startClient(gen), 600);
}
function clientHeartbeat(gen,c){
  clearInterval(hbTimer);
  hbTimer=setInterval(()=>{
    if(gen!==joinGen || p2pHost || c!==conn){ clearInterval(hbTimer); return; }
    if(c.open) try{ c.send({t:"ping"}); }catch(e){}
    if(Date.now()-lastHostMsg > 15000){ clearInterval(hbTimer); startRejoin(gen); }   // ホストから応答なし
  },4000);
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState!=="visible" || mode!=="online" || net!=="p2p" || p2pHost || kicked) return;
  if(!conn || !conn.open || Date.now()-lastHostMsg>8000){ if(!rejoinUntil) startRejoin(joinGen); }
});

// ホストがIDを失った時：IDを取った空の部屋に、今のゲーム状態ごと合流する
function recoverLostId(gen){
  netBar("部屋を復旧中…");
  const tmp=new window.Peer(PEER_OPTS());
  tmp.on("open", ()=>{
    const c=tmp.connect(roomPeerId,{reliable:true});
    const to=setTimeout(()=>{ try{tmp.destroy()}catch(e){} netBar(""); toast("部屋の復旧に失敗…いったん入り直してね"); },10000);
    c.on("open", ()=>c.send({t:"merge", full:S}));
    c.on("data", m=>{
      if(m && m.mergeOk){
        clearTimeout(to);
        for(const x of conns.values()) try{ x.send({migrate:"_"}); }catch(e){}
        setTimeout(()=>{
          for(const x of conns.values()) try{ x.close(); }catch(e){}
          conns.clear(); try{ peer.destroy(); }catch(e){} try{ tmp.destroy(); }catch(e){}
          p2pHost=false; clearInterval(hbTimer);
          rejoinUntil=Date.now()+30000; startClient(gen);
        },400);
      } else if(m && m.mergeNo){ clearTimeout(to); try{tmp.destroy()}catch(e){} netBar(""); toast("同じ合言葉の別の部屋ができちゃった…合言葉を変えてね"); }
    });
  });
  tmp.on("error", e=>{
    if(e.type==="peer-unavailable"){ try{tmp.destroy()}catch(_){} try{ peer.reconnect(); }catch(_){} }  // IDが空いた→取り戻す
  });
}
function handleMerge(c,m){
  const st=m.full;
  const ok = S && S.phase==="lobby" && S.round===0 && S.players.filter(p=>!p.bot).length<=1 && st && Array.isArray(st.players);
  if(!ok){ try{ c.send({mergeNo:1}); }catch(e){} return; }
  st.host=myId; S=st;
  hostApply(myId,{t:"join",name:myName});
  try{ c.send({mergeOk:1}); }catch(e){}
  toast("元の部屋に合流したよ");
}

function joinP2P(name, pass){

function failP2P(m){ backToEntry(m); }
function cleanupP2P(){

// ホストが抜けるときは、残っている人にホストを引き継ぐ
async function handoffHost(){
  const s=clone(S);
  if(applyAction(s,myId,{t:"leave"})!==true) return;
  const nh=s.host;
  if(nh===myId || !liveConn(nh)) return;
  for(const [pid,c] of conns){ try{ c.send(pid===nh ? {migrate:nh, full:s} : {migrate:nh}); }catch(e){} }
  await sleep(500);
}

function backToEntry(msg){

// 手札の扇配置（純関数）。描画時に最初から正しい位置に置くので、再描画でカードが飛ばない
function handGeom(n, W){
  const cw=Math.round(Math.min(72, Math.max(50, W/5.6))), ch=cw*1.42;
  const split = n>15 ? Math.ceil(n/2) : n;
  const rows = n>15 ? [split, n-split] : [n];
  const rowGap=Math.round(ch*.5), pos=[]; let maxBottom=0;
  rows.forEach((m,ri)=>{
    const base=26+ri*rowGap, spread=Math.min(28,m*2.4), half=spread/2*Math.PI/180;
    const margin=6+ch*Math.sin(half), step=m>1?Math.min(cw*.7,(W-2*margin-cw)/(m-1)):0, drop=22*(spread/28);
    for(let i=0;i<m;i++){
      const t=m>1?i/(m-1)-.5:0, x=W/2+(i-(m-1)/2)*step-cw/2, y=base+t*t*4*drop;
      pos.push({x,y,rot:t*spread,z:ri*100+i+1}); maxBottom=Math.max(maxBottom,y+ch);
    }
  });
  return {cw, pos, height:maxBottom+10};
}
const handTf = (p,lift) => `translate(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px) rotate(${p.rot.toFixed(2)}deg) translateY(${-lift}px)`;
function layoutHand(){
  const el=document.getElementById("hand"); if(!el) return;
  const cards=[...el.querySelectorAll(".card")], G=handGeom(cards.length, el.clientWidth);
  cards.forEach((c,i)=>{ c.style.setProperty("--cw",G.cw+"px"); c.style.zIndex=G.pos[i].z; c.style.transform=handTf(G.pos[i], c.classList.contains("sel")?24:0); });
  el.style.height=G.height+"px";
}
window.addEventListener("resize", ()=>{ layoutHand(); placeBar(); });
